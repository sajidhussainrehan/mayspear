<title>Mayspear Global</title>
<meta name="robots" content="index, follow">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0C0B09;overflow:hidden;height:100vh;font-family:'Archivo',sans-serif}
@keyframes wSpear{0%{opacity:1;transform:none scale(.85)}55%{opacity:1;transform:translateY(0) scale(1.04)}100%{opacity:1;transform:translateY(0) scale(1)}}

@keyframes wQuote{from{opacity:1;transform:none}to{opacity:1;transform:translateY(0)}}
@keyframes wBar{from{width:0%}to{width:100%}}
@keyframes wOut{from{opacity:1}to{opacity:0}}
</style>
</helmet>

<div style="position:fixed;inset:0;background:#0C0B09;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:{{ outAnim }}">
 <div style="position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 42%,rgba(184,155,106,.10),transparent 65%)"></div>
 <div style="position:relative;animation:wSpear 1s cubic-bezier(.2,.8,.2,1) both">

   <path d="M10 0 L16 9 L10 14 L4 9 Z" fill="#B89B6A"></path>

   <rect x="5.5" y="16" width="9" height="1.4" fill="#B89B6A"></rect>
  </svg>
 </div>
 <div style="position:relative;margin-top:30px;font-family:'Libre Caslon Text',serif;font-size:clamp(22px,4vw,32px);letter-spacing:.3em;color:#F1ECE2;animation:wWord 1.1s ease .5s both">MAYSPEAR GLOBAL</div>
 <div style="position:relative;margin-top:30px;font-family:'Libre Caslon Display',serif;font-style:italic;font-weight:700;font-size:clamp(17px,2vw,24px);color:#F1ECE2;max-width:20ch;line-height:1.24;letter-spacing:-.005em;text-shadow:0 2px 30px rgba(184,155,106,.3);animation:wQuote .9s ease 1.1s both">Conviction is capital.<br><span style="color:#B89B6A">Everything else is noise.</span></div>

 </div>
 <a href="Mayspear%20Global.dc.html" style="position:relative;margin-top:26px;display:inline-flex;align-items:center;gap:9px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#6B5D3E;animation:wQuote .9s ease 1.4s both" style-hover="color:#B89B6A"><svg width="8" height="12" viewBox="0 0 20 30" fill="currentColor" style="flex:none"><path d="M10 0 L16 9 L10 14 L4 9 Z"></path><rect x="9.25" y="12.5" width="1.5" height="17.5"></rect><rect x="5.5" y="16" width="9" height="1.4"></rect></svg>Skip</a>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
 state = { leaving: false };
 componentDidMount() {
  this._t1 = setTimeout(() => this.setState({ leaving: true }), 6900);
  this._t2 = setTimeout(() => { window.location.href = 'Mayspear Global.dc.html'; }, 7300);
 }
 componentWillUnmount() { clearTimeout(this._t1); clearTimeout(this._t2); }
 renderVals() {
  return { outAnim: this.state.leaving ? 'wOut .4s ease both' : 'none' };
 }
}

</script>

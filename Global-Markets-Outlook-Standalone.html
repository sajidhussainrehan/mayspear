document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

fill=\"#9A7B3F\"><\u002Frect><\u002Fsvg>\n    <span style=\"display:flex;flex-direction:column;line-height:1\">\n      <span style=\"font-family:'Libre Caslon Text',serif;font-size:20px;letter-spacing:.2em;color:#1C1913\">MAYSPEAR<\u002Fspan>\n      <span style=\"font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.4em;color:#9C9584;margin-top:4px\">GLOBAL · PRINCIPAL CAPITAL<\u002Fspan>\n    <\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"margin-top:auto;padding-bottom:0.7in\">\n    <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:30px\"><span style=\"width:46px;height:2px;background:#9A7B3F\"><\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:#9A7B3F\">Global Markets Outlook · August 2026<\u002Fspan><\u002Fdiv>\n    <h1 style=\"font-family:'Libre Caslon Display',serif;font-weight:400;font-size:60px;line-height:1.0;letter-spacing:-.015em;margin:0;max-width:15ch;color:#171410\">Emerging and developed markets, in one view.<\u002Fh1>\n    <p style=\"margin-top:30px;max-width:58ch;font-size:15.5px;line-height:1.74;color:#4E4838\">Where private capital will be made across both halves of the global economy over the next decade: the credit gap and reform momentum reshaping emerging markets, and the refinancing wall and re-industrialisation reshaping developed markets.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid rgba(28,25,19,.18);background:#EFE8D9\">\n    <div style=\"padding:24px 16px 26px 0\"><div style=\"font-family:'Libre Caslon Display',serif;font-size:24px;color:#9A7B3F\">Part I<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:#8A8370;margin-top:8px\">Emerging markets<\u002Fdiv><\u002Fdiv>\n    <div style=\"padding:24px 16px 26px;border-left:1px solid rgba(28,25,19,.1)\"><div style=\"font-family:'Libre Caslon Display',serif;font-size:24px;color:#9A7B3F\">Part II<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:#8A8370;margin-top:8px\">Developed markets<\u002Fdiv><\u002Fdiv>\n    <div style=\"padding:24px 16px 26px;border-left:1px solid rgba(28,25,19,.1)\"><div style=\"font-family:'Libre Caslon Display',serif;font-size:24px;color:#9A7B3F\">Aug 2026<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:#8A8370;margin-top:8px\">Publication date<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- PART I: EMERGING MARKETS -->\n<div style=\"background:#FCFAF4;color:#1C1913;padding:0.72in 0.66in 0.5in;font-family:'Archivo',sans-serif\">\n  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.3em;color:#9A7B3F\">PART I<\u002Fdiv>\n  <h2 style=\"font-family:'Libre Caslon Display',serif;font-weight:400;font-size:34px;line-height:1.06;letter-spacing:-.01em;margin:8px 0 0;max-width:18ch\">Emerging markets: the hottest frontier in private capital.<\u002Fh2>\n  <div style=\"height:2px;background:#9A7B3F;width:46px;margin:22px 0 24px\"><\u002Fdiv>\n  <p style=\"font-size:14.5px;line-height:1.74;color:#403B2E;max-width:70ch\">Emerging economies enter this cycle from a position of relative strength: public debt ratios below developed market peers, room for selective monetary easing, and a weaker dollar that eases dollar denominated obligations. The credit gap, not the equity index, is where the private capital opportunity actually sits. Across large parts of Africa and Southeast Asia, credit to the private sector remains a small fraction of GDP relative to developed peers, a gap that closes through direct lending, trade finance and asset based structures a conventional bank will not originate.<\u002Fp>\n\n  <div style=\"margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:26px\">\n    <div style=\"break-inside:avoid\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#9A7B3F;margin-bottom:10px\">Africa<\u002Fdiv><p style=\"font-size:13px;line-height:1.62;color:#403B2E\">Trade finance and infrastructure structured against real cash flow: contracted offtake, receivables and reserves, not headline country risk.<\u002Fp><\u002Fdiv>\n    <div style=\"break-inside:avoid\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#9A7B3F;margin-bottom:10px\">Southeast Asia<\u002Fdiv><p style=\"font-size:13px;line-height:1.62;color:#403B2E\">Manufacturing diversification and supply chain redundancy, financed as a private credit and private equity opportunity, not only a trade story.<\u002Fp><\u002Fdiv>\n    <div style=\"break-inside:avoid\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#9A7B3F;margin-bottom:10px\">The Gulf<\u002Fdiv><p style=\"font-size:13px;line-height:1.62;color:#403B2E\">Capital market reform and diversification capital, co-investing alongside sovereign vehicles in structured tranches they do not originate directly.<\u002Fp><\u002Fdiv>\n    <div style=\"break-inside:avoid\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#9A7B3F;margin-bottom:10px\">Latin America<\u002Fdiv><p style=\"font-size:13px;line-height:1.62;color:#403B2E\">Infrastructure and resource financing anchored in offtake, royalty streams and hard collateral, holding value through political cycles.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:28px;background:#171410;color:#EFE8D9;padding:22px 24px;break-inside:avoid\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#C6A461;margin-bottom:10px\">The discipline that matters most<\u002Fdiv>\n    <p style=\"font-size:13.5px;line-height:1.66;color:#CFC7B3;margin:0\">Currency mismatch, dollar liabilities against local currency revenue, is the most common failure mode in emerging market private capital. The structures that hold up finance in local currency where the revenue is local, hedge explicitly where they cannot, and lend against hard collateral rather than a macro forecast.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- PART II: DEVELOPED MARKETS -->\n<div style=\"background:#FCFAF4;color:#1C1913;padding:0.5in 0.66in 0.5in;font-family:'Archivo',sans-serif;break-before:page\">\n  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.3em;color:#9A7B3F\">PART II<\u002Fdiv>\n  <h2 style=\"font-family:'Libre Caslon Display',serif;font-weight:400;font-size:34px;line-height:1.06;letter-spacing:-.01em;margin:8px 0 0;max-width:20ch\">Developed markets: where the next decade will be made.<\u002Fh2>\n  <div style=\"height:2px;background:#9A7B3F;width:46px;margin:22px 0 24px\"><\u002Fdiv>\n  <p style=\"font-size:14.5px;line-height:1.74;color:#403B2E;max-width:70ch\">A wall of maturing debt, a rebuilding of industrial capacity, and the institutionalisation of private credit are converging at the same time, in the same markets. None of these forces are speculative: they are already visible in corporate maturity schedules, government and industrial capital expenditure plans, and the capital positions of insurers now treating private credit as a permanent allocation.<\u002Fp>\n\n  <div style=\"margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:26px\">\n    <div style=\"break-inside:avoid\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#9A7B3F;margin-bottom:10px\">The refinancing wall<\u002Fdiv><p style=\"font-size:13px;line-height:1.62;color:#403B2E\">Debt issued at lower rates must refinance at structurally higher cost, generating a multi year pipeline of refinancing and rescue mandates already on the calendar.<\u002Fp><\u002Fdiv>\n    <div style=\"break-inside:avoid\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#9A7B3F;margin-bottom:10px\">Re-industrialisation<\u002Fdiv><p style=\"font-size:13px;line-height:1.62;color:#403B2E\">Reshoring, energy security and supply chain redundancy driving industrial capex that public markets alone cannot fund.<\u002Fp><\u002Fdiv>\n    <div style=\"break-inside:avoid\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#9A7B3F;margin-bottom:10px\">Institutionalisation<\u002Fdiv><p style=\"font-size:13px;line-height:1.62;color:#403B2E\">Insurers and permanent capital treating private credit as core infrastructure, deepening and steadying the capital available to borrowers.<\u002Fp><\u002Fdiv>\n    <div style=\"break-inside:avoid\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#9A7B3F;margin-bottom:10px\">Take privates<\u002Fdiv><p style=\"font-size:13px;line-height:1.62;color:#403B2E\">Persistent valuation gaps and the flexibility of private ownership drawing founder and family controlled companies out of public markets.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:28px;background:#171410;color:#EFE8D9;padding:22px 24px;break-inside:avoid\">\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#C6A461;margin-bottom:10px\">Reading the region correctly<\u002Fdiv>\n    <p style=\"font-size:13.5px;line-height:1.66;color:#CFC7B3;margin:0\">The United States offers higher growth with more inflation risk; Europe offers cheaper entry valuations against softer consumption. Neither should be underwritten as a single macro bet. Every situation, a refinancing, an industrial asset, a founder transition, rewards its own structural underwriting.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:34px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;border-top:1px solid rgba(28,25,19,.14);padding-top:24px\">\n    <div><div style=\"font-family:'Libre Caslon Display',serif;font-size:20px;color:#171410\">Have a transaction in either market?<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#6B5D3E;margin-top:6px\">enquiries@mayspear.com<\u002Fdiv><\u002Fdiv>\n    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.14em;color:#8A8370\">© 2026 Mayspear Global. General information only, not investment advice.<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() { return { doPrint: () => window.print() }; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
